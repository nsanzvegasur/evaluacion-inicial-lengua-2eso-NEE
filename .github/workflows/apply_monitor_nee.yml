name: Apply monitor NEE
on:
  push:
    paths:
      - '.github/workflows/apply_monitor_nee.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_app_core.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from datetime import datetime\n\nimport pandas as pd\nimport streamlit as st\n','from datetime import datetime\nfrom pathlib import Path\n\nimport pandas as pd\nimport streamlit as st\nimport streamlit.components.v1 as components\n')
          s=s.replace('EXAM = EXAMEN["2ESO_NEE"]\n','EXAM = EXAMEN["2ESO_NEE"]\nTAB_MONITOR = components.declare_component("tab_monitor", path=str(Path(__file__).parent / "tab_monitor"))\nif "cambios_pestana" not in st.session_state:\n    st.session_state.cambios_pestana = 0\n')
          old='st.markdown(\'<div class="subtitulo">Lengua Castellana y Literatura · Curso 2026-2027</div>\', unsafe_allow_html=True)\n'
          new=old+'evento_pestana = TAB_MONITOR(key="monitor_pestana")\nif isinstance(evento_pestana, dict):\n    nuevo = int(evento_pestana.get("count", 0) or 0)\n    if nuevo > st.session_state.cambios_pestana:\n        st.session_state.cambios_pestana = nuevo\nif not st.session_state.get("enviado") and st.session_state.cambios_pestana > 0:\n    if st.session_state.cambios_pestana >= 3:\n        st.error("Se han detectado 3 cambios de pestaña o salida de la ventana. El examen se enviará automáticamente.")\n    else:\n        restante = 3 - st.session_state.cambios_pestana\n        st.warning(f"Cambio de pestaña detectado ({st.session_state.cambios_pestana}). Evita salir del examen. Tras {restante} cambio(s) más, el examen se enviará automáticamente.")\n'
          s=s.replace(old,new,1)
          s=s.replace('    enviar=st.form_submit_button("ENVIAR EXAMEN",use_container_width=True)\n\nif enviar:\n','    enviar=st.form_submit_button("ENVIAR EXAMEN",use_container_width=True)\n\nif enviar or st.session_state.cambios_pestana >= 3:\n',1)
          s=s.replace('"produccion_escrita_pendiente":"Sí · hasta +1 punto"}','"produccion_escrita_pendiente":"Sí · hasta +1 punto", "cambios_pestana":st.session_state.cambios_pestana}',1)
          s=s.replace('st.session_state.update(enviado=True,fila=fila,puntos=puntos,nota9=nota9,faltas=faltas,tildes=tildes)','st.session_state.update(enviado=True,fila=fila,puntos=puntos,nota9=nota9,faltas=faltas,tildes=tildes,respuestas=respuestas)',1)
          s=s.replace('    st.write(f"Fecha y hora: {fila[\'date\']}")\n','    st.write(f"Fecha y hora: {fila[\'date\']}")\n    if int(fila.get("cambios_pestana", 0) or 0) > 0:\n        cambios=int(fila.get("cambios_pestana", 0) or 0)\n        st.warning(f"Durante el examen se detectaron {cambios} cambios de pestaña o salida de la ventana.")\n',1)
          p.write_text(s,encoding='utf-8')
          a=Path('app.py')
          t=a.read_text(encoding='utf-8')
          t=t.replace('    ws["A5"]="Fecha y hora"; ws["B5"]=fila.get("date","")\n','    ws["A5"]="Fecha y hora"; ws["B5"]=fila.get("date","")\n    ws["A6"]="Cambios de pestaña detectados"; ws["B6"]=fila.get("cambios_pestana",0)\n')
          a.write_text(t,encoding='utf-8')
          d=Path('tab_monitor'); d.mkdir(exist_ok=True)
          d.joinpath('index.html').write_text('<!doctype html><html><head><script>let c=0;function m(x){parent.postMessage(x,"*")}addEventListener("load",()=>{m({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1});document.addEventListener("visibilitychange",()=>{if(document.hidden){c++;m({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{count:c}})}})})</script></head><body></body></html>',encoding='utf-8')
          PY
          python -m py_compile _app_core.py app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _app_core.py app.py tab_monitor
          git commit -m 'Añadir monitor de cambios de pestaña a la evaluación NNEE'
          git push
