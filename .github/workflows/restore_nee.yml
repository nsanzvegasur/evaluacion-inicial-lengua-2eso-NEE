name: Restaurar NNEE anterior
on:
  push:
    paths:
      - '.github/workflows/restore_nee.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar archivos al estado funcional anterior
        run: |
          git checkout 6cc0f8de797002fc15ddde1b1654106cb9bc2915 -- app.py _app_core.py
          rm -rf tab_monitor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py _app_core.py tab_monitor
          git commit -m "Restaurar NNEE al estado funcional anterior" || exit 0
          git push
      - name: Eliminar workflow temporal
        run: |
          git rm .github/workflows/restore_nee.yml
          git commit -m "Eliminar workflow temporal de restauración"
          git push
