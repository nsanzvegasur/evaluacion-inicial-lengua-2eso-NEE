name: Implementar monitor de pestañas NNEE
on:
  push:
    paths:
      - '.github/workflows/implementar_monitor_pestanas.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implementar monitor y registro
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('_app_core.py')
          s = core.read_text(encoding='utf-8')

          s = s.replace(
              'from datetime import datetime\n\nimport pandas as pd\nimport streamlit as st\n',
              'from datetime import datetime\nfrom pathlib import Path\n\nimport pandas as pd\nimport streamlit as st\nimport streamlit.components.v1 as components\n'
          )
          s = s.replace(
              'EXAM = EXAMEN["2ESO_NEE"]\n',
              'EXAM = EXAMEN["2ESO_NEE"]\nTAB_MONITOR = components.declare_component("tab_monitor", path=str(Path(__file__).parent / "tab_monitor"))\n\nif "cambios_pestana" not in st.session_state:\n    st.session_state.cambios_pestana = 0\n'
          )
          marcador = 'st.markdown(\'<div class="subtitulo">Lengua Castellana y Literatura · Curso 2026-2027</div>\', unsafe_allow_html=True)\n'
          monitor = '''st.markdown('<div class="subtitulo">Lengua Castellana y Literatura · Curso 2026-2027</div>', unsafe_allow_html=True)

# Detecta cambios de pestaña o cuando la ventana deja de estar visible.
evento_pestana = TAB_MONITOR(key="monitor_pestana")
if isinstance(evento_pestana, dict):
    try:
        nuevo = int(evento_pestana.get("count", 0))
        if nuevo > st.session_state.cambios_pestana:
            st.session_state.cambios_pestana = nuevo
    except (TypeError, ValueError):
        pass

if not st.session_state.get("enviado") and st.session_state.cambios_pestana > 0:
    if st.session_state.cambios_pestana >= 3:
        st.error("Se han detectado 3 cambios de pestaña o salida de la ventana. El examen se enviará automáticamente.")
    else:
        restante = 3 - st.session_state.cambios_pestana
        st.warning(f"Cambio de pestaña detectado ({st.session_state.cambios_pestana}). Evita salir del examen. Tras {restante} cambio(s) más, el examen se enviará automáticamente.")
'''
          s = s.replace(marcador, monitor, 1)
          s = s.replace(
              '    enviar=st.form_submit_button("ENVIAR EXAMEN",use_container_width=True)\n\nif enviar:\n',
              '    enviar=st.form_submit_button("ENVIAR EXAMEN",use_container_width=True)\n\nif enviar or st.session_state.cambios_pestana >= 3:\n',
              1
          )
          s = s.replace(
              '"produccion_escrita_pendiente":"Sí · hasta +1 punto"}',
              '"produccion_escrita_pendiente":"Sí · hasta +1 punto", "cambios_pestana":st.session_state.cambios_pestana}',
              1
          )
          s = s.replace(
              'st.session_state.update(enviado=True,fila=fila,puntos=puntos,nota9=nota9,faltas=faltas,tildes=tildes)',
              'st.session_state.update(enviado=True,fila=fila,puntos=puntos,nota9=nota9,faltas=faltas,tildes=tildes,respuestas=respuestas)',
              1
          )
          s = s.replace(
              '    st.write(f"Fecha y hora: {fila[\'date\']}")\n',
              '    st.write(f"Fecha y hora: {fila[\'date\']}")\n    if int(fila.get("cambios_pestana", 0) or 0) > 0:\n        cambios = int(fila.get("cambios_pestana", 0) or 0)\n        st.warning(f"Durante el examen se detectaron {cambios} cambios de pestaña o salida de la ventana.")\n',
              1
          )
          core.write_text(s, encoding='utf-8')

          app = Path('app.py')
          a = app.read_text(encoding='utf-8')
          a = a.replace(
              '    ws["A5"]="Fecha y hora"; ws["B5"]=fila.get("date","")\n',
              '    ws["A5"]="Fecha y hora"; ws["B5"]=fila.get("date","")\n    ws["A6"]="Cambios de pestaña detectados"; ws["B6"]=fila.get("cambios_pestana",0)\n'
          )
          app.write_text(a, encoding='utf-8')

          d = Path('tab_monitor')
          d.mkdir(exist_ok=True)
          (d / 'index.html').write_text('''<!DOCTYPE html>
<html><head><meta charset="utf-8"><script>
let count = 0;
function send(type) {
  window.parent.postMessage({isStreamlitMessage:true,type:type}, '*');
}
function value() {
  window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{count:count}}, '*');
}
window.addEventListener('load', () => {
  send('streamlit:componentReady');
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { count += 1; value(); }
  });
  window.addEventListener('blur', () => { count += 1; value(); });
});
</script></head><body></body></html>''', encoding='utf-8')
          (d / 'README.md').write_text('Componente local para detectar cambios de pestaña o pérdida de visibilidad durante la evaluación.', encoding='utf-8')
          PY
          python -m py_compile _app_core.py app.py
      - name: Guardar cambios y eliminar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _app_core.py app.py tab_monitor
          git rm .github/workflows/implementar_monitor_pestanas.yml
          git commit -m 'Añadir monitor de cambios de pestaña a la evaluación NNEE'
          git push
