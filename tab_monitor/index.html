<!DOCTYPE html><html><head><meta charset="utf-8"><script>let count=0;function send(t){window.parent.postMessage({isStreamlitMessage:true,type:t},'*')}function value(){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{count:count}},'*')}window.addEventListener('load',()=>{send('streamlit:componentReady');document.addEventListener('visibilitychange',()=>{if(document.hidden){count+=1;value()}});window.addEventListener('blur',()=>{count+=1;value()})});</script></head><body></body></html>
